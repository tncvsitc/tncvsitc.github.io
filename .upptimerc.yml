owner: tncvsitc
repo: tncvsitc.github.io

sites:
  - name: 社團網站
    url: https://tncvsitc.duckdns.org

status-website:
  # 👇👇👇 改用這行（填入你的 github.io 完整網址），並把 baseUrl 刪除 👇👇👇
  cname: tncvsitc.github.io

  name: TNCVS ITC Status
  introTitle: 南商資研服務狀態
  introMessage: 這裡是南商資研社系統服務狀態資訊頁面，由 Upptime 技術支援。
  logoUrl: https://tncvsitc.duckdns.org/img/logo_icon.png

  navbar:
    - title: "服務狀態"
      href: "/"
    - title: "社團首頁"
      href: "https://tncvsitc.duckdns.org"
    - title: "聯絡我們"
      href: "mailto:tncvsitc@gmail.com"

  theme: system

  customCSS: |
    body {
      font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    /* 把原本的 .bg-gradient 改成 header（Upptime 頂部的導覽列） */
    header {
      background: linear-gradient(90deg, #1e3c72 0%, #2a5298 100%) !important;
      padding: 15px !important;
    }
    header a, header h1, header span {
      color: #ffffff !important;
    }

