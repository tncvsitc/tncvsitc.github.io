  graphs: 統計圖表
  allSystemsDegraded: 部分系統效能降低
  someSystemsDegraded: 系統異常
  allSystemsDown: 所有系統中斷服務
  someSystemsDown: 系統部分停機
  degradedPerformance: 效能降低
  partialOutage: 部分中斷
  majorOutage: 嚴重中斷
  unknownStatus: 狀態未知
  operational: 運作正常
  status: 狀態
  history: 歷史紀錄
  up: 運作正常
  down: 停止服務
  degraded: 效能降低
  overallUptime: "整體在線率：$UPTIME%"
  responseTime: "平均回應時間"
  averageResponseTime: "平均回應時間"
  averageResponse: "平均回應時間"
  responseTimeGraph: 回應時間趨勢
  liveStatus: 即時狀態
