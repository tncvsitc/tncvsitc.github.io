owner: tncvsitc
repo: tncvsitc.github.io

workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
  uptime: "*/5 * * * *"

sites:
  - name: 社團網站
    url: https://tncvsitc.duckdns.org

status-website:
  cname: tncvsitc.github.io

  name: TNCVS ITC Status
  introTitle: 南商資研服務狀態
  # 👇 透過小腳本自動將頁面上的 undefined 修正為 ms 👇
  introMessage: 這裡是南商資研社系統服務狀態資訊頁面，由 Upptime 技術支援。<script>setInterval(()=>{document.querySelectorAll('.live-status div').forEach(e=>{if(e.innerHTML.includes('undefined'))e.innerHTML=e.innerHTML.replace('undefined','ms')})},200);</script>
  
  logoUrl: https://raw.githubusercontent.com/tncvsitc/tncvsitc.github.io/master/img/logo_icon.png

  navbar:
    - title: "服務狀態"
      href: "/"
    - title: "社團首頁"
      href: "https://tncvsitc.duckdns.org"
    - title: "聯絡我們"
      href: "mailto:tncvsitc@gmail.com"

  theme: light

  customCSS: |
    body {
      font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    /* 頂部導覽列樣式 */
    header {
      background: linear-gradient(90deg, #1e3c72 0%, #2a5298 100%) !important;
      padding: 15px !important;
    }
    header a, header h1, header span {
      color: #ffffff !important;
    }

    /* 👇👇👇 根據實際 HTML 標籤精準中文化詳細頁面 👇👇👇 */
    /* 1. 替換 Overall uptime 與 Average response */
    dl dt {
      font-size: 0 !important;
    }
    dl dt::after {
      font-size: 1rem !important;
      font-weight: bold;
    }
    dl dt:nth-of-type(1)::after {
      content: "整體在線率";
    }
    dl dt:nth-of-type(2)::after {
      content: "平均回應時間";
    }

    /* 2. 替換圖表標題 7-day response time */
    main section:has(canvas) h2,
    main section h2:has(+ canvas) {
      font-size: 0 !important;
    }
    main section:has(canvas) h2::after,
    main section h2:has(+ canvas)::after {
      font-size: 1.5rem !important;
      font-weight: bold;
      content: "近 7 天回應時間趨勢";
    }

# 繁體中文語系
