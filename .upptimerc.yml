  allSystemsDown: 所有系統中斷服務
  someSystemsDown: 系統部分停機
  degradedPerformance: 效能降低
  partialOutage: 部分中斷
  majorOutage: 嚴重中斷
  unknownStatus: 狀態未知
  operational: 運作正常
  status: 狀態
  history: 歷史紀錄
  up: 運作正常
  down: 停止服務
  degraded: 效能降低
  overallUptime: "整體在線率：$UPTIME%"
