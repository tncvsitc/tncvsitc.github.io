owner: tncvsitc
repo: tncvsitc.github.io

sites:
  - name: 社團網站
    url: https://tncvsitc.duckdns.org

status-website:
  cname: tncvsitc.github.io

  name: TNCVS ITC Status
  introTitle: 南商資研服務狀態
  introMessage: 這裡是南商資研社系統服務狀態資訊頁面，由 Upptime 技術支援。
  logoUrl: https://raw.githubusercontent.com/tncvsitc/tncvsitc.github.io/main/img/logo_icon.png

  navbar:
    - title: "服務狀態"
      href: "/"
    - title: "社團首頁"
      href: "https://tncvsitc.duckdns.org"
    - title: "聯絡我們"
      href: "mailto:tncvsitc@gmail.com"


  customCSS: |
    body {
      font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    /* 頂部導覽列樣式 */
    header {
      background: linear-gradient(90deg, #1e3c72 0%, #2a5298 100%) !important;
      padding: 15px !important;
    }
    header a, header h1, header span {
      color: #ffffff !important;
    }

    /* 👇👇👇 將詳細頁面寫死的英文標題替換為中文 👇👇👇 */
    /* 替換 Overall uptime */
    .f-overall-uptime, h2:has(+ p), h2:has(+ div) {
      font-size: 0 !important;
    }
    main h2 {
      font-size: 0 !important;
    }
    main h2::after {
      font-size: 1.25rem !important;
    }
    /* 針對詳細頁的英文替換 */
    main h2:nth-of-type(1)::after {
      content: "整體在線率" !important;
    }
    main h2:nth-of-type(2)::after {
      content: "平均回應時間" !important;
    }
    main h2:nth-of-type(3)::after {
      content: "近 7 天回應時間趨勢" !important;
    }

# 繁體中文語系 (修復變數與 undefined 問題)
i18n:
